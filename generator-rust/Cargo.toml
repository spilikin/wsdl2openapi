[package]
name = "wsdl2openapi2rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generates Rust types and SOAP envelopes from wsdl2openapi OpenAPI specs"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
heck = "0.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "printing"] }
